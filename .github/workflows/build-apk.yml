name: Compilar Tá On Mídia Player APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Instalar dependências
        run: npm install

      - name: 5. Gerar projeto Android nativo
        run: npx expo prebuild --platform android --clean

      - name: 6. Dar permissão ao Gradle
        run: chmod +x ./android/gradlew

      - name: 7. Compilar APK pronto para TV Box
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: 8. Exportar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: TaOnMidia-Player-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
